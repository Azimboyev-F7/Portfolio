  <!-- TexnoFazo: ERP table + Telegram message -->
  <g>
    <rect x="1050" y="330" width="430" height="300" rx="28" fill="#ffffff"/>
    <text x="1086" y="388" font-size="26" font-weight="700" fill="#15171a">Client list</text>
    <g fill="#ebe9f7"><rect x="1086" y="416" width="358" height="16" rx="8"/><rect x="1086" y="458" width="358" height="16" rx="8"/><rect x="1086" y="500" width="358" height="16" rx="8"/></g>
    <g fill="#4b3bff"><rect x="1086" y="416" width="230" height="16" rx="8"/><rect x="1086" y="458" width="280" height="16" rx="8"/><rect x="1086" y="500" width="180" height="16" rx="8"/></g>
    <rect x="1086" y="548" width="140" height="44" rx="22" fill="#e8e5ff"/>
    <text x="1156" y="577" text-anchor="middle" font-size="17" font-weight="700" fill="#4b3bff">TexnoFazo</text>
