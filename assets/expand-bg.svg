  <path d="M160 880 C 520 820, 760 900, 1100 860 S 1420 820, 1480 840" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14"/>
