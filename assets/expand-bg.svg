  <g>
    <rect x="1130" y="680" width="360" height="130" rx="28" fill="#2aabee"/>
    <rect x="1130" y="680" width="360" height="130" rx="28" fill="#2aabee"/>
    <circle cx="1180" cy="730" r="22" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M1170 732l8 4 14-12-10 16z" fill="#2aabee"/>
    <text x="1220" y="724" font-size="20" font-weight="700" fill="#ffffff">Telegram bot</text>
    <text x="1220" y="756" font-size="17" fill="#ffffff" fill-opacity="0.92">Your goods list is ready</text>
    <rect x="1220" y="772" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.5"/>
