    <text x="170" y="378" font-size="34" font-weight="700" fill="#15171a">University matches</text>
    <g font-size="19" fill="#5b6068">
      <text x="170" y="440">Match A</text><text x="530" y="440" text-anchor="end" font-weight="700" fill="#15171a">92%</text>
      <text x="170" y="520">Match B</text><text x="530" y="520" text-anchor="end" font-weight="700" fill="#15171a">81%</text>
      <text x="170" y="600">Match C</text><text x="530" y="600" text-anchor="end" font-weight="700" fill="#15171a">74%</text>
    </g>
    <rect x="170" y="456" width="360" height="12" rx="6" fill="#ebe9f7"/><rect x="170" y="456" width="331" height="12" rx="6" fill="#4b3bff"/>
    <rect x="170" y="536" width="360" height="12" rx="6" fill="#ebe9f7"/><rect x="170" y="536" width="292" height="12" rx="6" fill="#4b3bff"/>
    <rect x="170" y="616" width="360" height="12" rx="6" fill="#ebe9f7"/><rect x="170" y="616" width="266" height="12" rx="6" fill="#4b3bff"/>
    <rect x="170" y="670" width="300" height="46" rx="23" fill="#15171a"/>
    <text x="320" y="700" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Ask the AI coach</text>
  </g>

  <!-- MyTeacher: phone -->
  <g>
    <rect x="690" y="150" width="270" height="560" rx="44" fill="#15171a"/>
    <rect x="706" y="166" width="238" height="528" rx="34" fill="#ffffff"/>
    <rect x="780" y="182" width="90" height="22" rx="11" fill="#15171a"/>
    <text x="730" y="256" font-size="22" font-weight="700" fill="#15171a">MyTeacher</text>
    <rect x="730" y="284" width="190" height="76" rx="16" fill="#e8e5ff"/>
    <rect x="746" y="302" width="110" height="12" rx="6" fill="#4b3bff"/><rect x="746" y="326" width="150" height="10" rx="5" fill="#b8b0ff"/>
    <rect x="730" y="376" width="190" height="76" rx="16" fill="#f1f1ee"/>
    <rect x="746" y="394" width="100" height="12" rx="6" fill="#8b8f97"/><rect x="746" y="418" width="140" height="10" rx="5" fill="#c9ccd2"/>
    <rect x="730" y="468" width="190" height="76" rx="16" fill="#f1f1ee"/>
    <rect x="746" y="486" width="120" height="12" rx="6" fill="#8b8f97"/><rect x="746" y="510" width="130" height="10" rx="5" fill="#c9ccd2"/>
